name: CI

# Run once per change: `pull_request` covers branches/PRs, `push` only on main
# (post-merge). Scoping push to main avoids the double run you'd get when a
# same-repo branch has an open PR (push + pull_request both firing).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The module and tcc-grant are macOS-only; the checks evaluate them in a
    # nix-darwin system.
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Module evaluation, the tcc-grant build, and the docs' diagrams up to date.
      - run: nix flake check ./dev --no-write-lock-file
