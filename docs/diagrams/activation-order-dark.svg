<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 384" width="1062" height="384" role="img"><style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ebf3ee; }
  .bg { fill: #17201b; }
  .box { fill: #202a24; stroke: #35443b; stroke-width: 2; }
  .key { fill: #4ade80; fill-opacity: .09; stroke: #4ade80; stroke-width: 2.5; }
  .alt { fill: #5ec8dc; fill-opacity: .08; stroke: #5ec8dc; stroke-width: 2.5; }
  .warn { fill: #f2b74a; fill-opacity: .08; stroke: #f2b74a; stroke-width: 2; stroke-dasharray: 7 6; }
  .head { font-size: 19px; font-weight: 700; }
  .lede { font-size: 14.5px; fill: #a1b3a8; }
  .title { font-size: 16px; font-weight: 650; }
  .sub { font-size: 13.5px; fill: #a1b3a8; }
  .field { font-size: 13.5px; font-weight: 650; fill: #ebf3ee; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #ebf3ee; }
  .code-bg { fill: #17201b; stroke: #35443b; stroke-width: 1; }
  .label { font-size: 13px; font-weight: 600; fill: #ebf3ee; }
  .edge { fill: none; stroke: #9db0a4; stroke-width: 2; marker-end: url(#arrow); }
  .tag { fill: #17201b; }
  .arrowhead { fill: #9db0a4; }
  .badge { fill: #4ade80; }
  .badge-text { font-size: 12px; font-weight: 700; fill: #17201b; }
  .dot { fill: #a1b3a8; }
  .ink { fill: none; stroke: #ebf3ee; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .ink-key { fill: none; stroke: #4ade80; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .ink-alt { fill: none; stroke: #5ec8dc; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .ink-warn { fill: none; stroke: #f2b74a; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1062" height="384" rx="16"/><text class="head" x="24" y="36">Rebuilt daemons start already allowed</text><text class="lede" x="24" y="60">build-pinned grants are written before launchd restarts anything; the rest after your apps are re-signed</text><rect class="key" x="24" y="92" width="278" height="160" rx="14"/><path class="ink-key" transform="translate(163 138)" d="M-6 -20l-5 40M8 -20l-5 40M-17 -7h36M-19 7h36"/><text class="title" x="163" y="188" text-anchor="middle">preActivation</text><text class="sub" x="163" y="207.8" text-anchor="middle">writes pin = "cdhash" grants for</text><text class="sub" x="163" y="226" text-anchor="middle">the new builds, reloads tccd</text><rect class="box" x="392" y="92" width="278" height="160" rx="14"/><path class="ink" transform="translate(531 138)" d="M15 -10a17 17 0 1 0 2 12M15 -22v12h-12"/><text class="title" x="531" y="188" text-anchor="middle">launchd</text><text class="sub" x="531" y="207.8" text-anchor="middle">restarts changed daemons; their</text><text class="sub" x="531" y="226" text-anchor="middle">grants are ready</text><rect class="alt" x="760" y="92" width="278" height="160" rx="14"/><path class="ink-alt" transform="translate(899 138)" d="M-12 -9a12 12 0 1 0 24 0a12 12 0 1 0 -24 0zM-5 -9l3.5 3.5l7 -7M-9 1l-4 19l13 -6l13 6l-4 -19"/><text class="title" x="899" y="188" text-anchor="middle">postActivation</text><text class="sub" x="899" y="207.8" text-anchor="middle">writes bundle-id and designated</text><text class="sub" x="899" y="226" text-anchor="middle">grants after any re-signing</text><path class="edge" d="M302 172L392 172"/><rect class="tag" x="314" y="144" width="66.1" height="22" rx="6"/><circle class="badge" cx="327" cy="155" r="9.5"/><text class="badge-text" x="327" y="159.5" text-anchor="middle">1</text><text class="label" x="345" y="159.5">then</text><path class="edge" d="M670 172L760 172"/><rect class="tag" x="682" y="144" width="66.1" height="22" rx="6"/><circle class="badge" cx="695" cy="155" r="9.5"/><text class="badge-text" x="695" y="159.5" text-anchor="middle">2</text><text class="label" x="713" y="159.5">then</text><rect class="warn" x="24" y="286" width="1014" height="74" rx="14"/><path class="ink-warn" transform="translate(62 325)" d="M0 -20l20 36h-40zM0 -6v9M0 9v0.5"/><text class="title" x="94" y="318">If build-pinned grants waited until postActivation</text><text class="sub" x="94" y="340">a rebuilt daemon would start against its previous build's grant, and macOS would ask “would like to control this computer?”</text></svg>
