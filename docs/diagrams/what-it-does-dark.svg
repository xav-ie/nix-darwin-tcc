<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 458" width="1062" height="458" role="img"><style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ebf3ee; }
  .bg { fill: #17201b; }
  .box { fill: #202a24; stroke: #35443b; stroke-width: 2; }
  .key { fill: #4ade80; fill-opacity: .09; stroke: #4ade80; stroke-width: 2.5; }
  .alt { fill: #5ec8dc; fill-opacity: .08; stroke: #5ec8dc; stroke-width: 2.5; }
  .warn { fill: #f2b74a; fill-opacity: .08; stroke: #f2b74a; stroke-width: 2; stroke-dasharray: 7 6; }
  .head { font-size: 19px; font-weight: 700; }
  .lede { font-size: 14.5px; fill: #a1b3a8; }
  .title { font-size: 16px; font-weight: 650; }
  .sub { font-size: 13.5px; fill: #a1b3a8; }
  .field { font-size: 13.5px; font-weight: 650; fill: #ebf3ee; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #ebf3ee; }
  .code-bg { fill: #17201b; stroke: #35443b; stroke-width: 1; }
  .label { font-size: 13px; font-weight: 600; fill: #ebf3ee; }
  .edge { fill: none; stroke: #9db0a4; stroke-width: 2; marker-end: url(#arrow); }
  .tag { fill: #17201b; }
  .arrowhead { fill: #9db0a4; }
  .badge { fill: #4ade80; }
  .badge-text { font-size: 12px; font-weight: 700; fill: #17201b; }
  .dot { fill: #a1b3a8; }
  .ink { fill: none; stroke: #ebf3ee; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .ink-key { fill: none; stroke: #4ade80; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .ink-alt { fill: none; stroke: #5ec8dc; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .ink-warn { fill: none; stroke: #f2b74a; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1062" height="458" rx="16"/><text class="head" x="24" y="36">Privacy permissions, declared in your nix-darwin config</text><text class="lede" x="24" y="60">each rebuild writes your grants into macOS's permission databases, so apps are allowed without clicking through System Settings</text><rect class="box" x="24" y="92" width="205.5" height="342" rx="14"/><path class="ink" transform="translate(126.8 229)" d="M-14 -20h18l10 10v30h-28zM4 -20v10h10M-5 2l-5 5l5 5M5 2l5 5l-5 5"/><text class="title" x="126.8" y="279" text-anchor="middle">Your config</text><text class="sub" x="126.8" y="298.8" text-anchor="middle">security.tcc.apps: apps</text><text class="sub" x="126.8" y="317" text-anchor="middle">and their permissions</text><rect class="box" x="293.5" y="92" width="205.5" height="342" rx="14"/><path class="ink" transform="translate(396.3 229)" d="M-22 -16h44a3 3 0 0 1 3 3v26a3 3 0 0 1 -3 3h-44a3 3 0 0 1 -3 -3v-26a3 3 0 0 1 3 -3zM-14 -6l7 6l-7 6M-2 8h12"/><text class="title" x="396.3" y="279" text-anchor="middle">darwin-rebuild switch</text><text class="sub" x="396.3" y="298.8" text-anchor="middle">writes the grants, then</text><text class="sub" x="396.3" y="317" text-anchor="middle">reloads tccd</text><rect class="key" x="832.5" y="92" width="205.5" height="342" rx="14"/><path class="ink-key" transform="translate(935.3 238.1)" d="M0 -21l17 6v10c0 12 -8 20 -17 24c-9 -4 -17 -12 -17 -24v-10zM-7 0l5 5l10 -10"/><text class="title" x="935.3" y="288.1" text-anchor="middle">Apps are allowed</text><text class="sub" x="935.3" y="307.9" text-anchor="middle">no prompts, no clicking</text><rect class="box" x="563" y="92" width="205.5" height="162" rx="14"/><path class="ink" transform="translate(665.8 117.2)" d="M-16 -14a16 6 0 1 0 32 0a16 6 0 1 0 -32 0zM-16 -14v28a16 6 0 0 0 32 0v-28M-16 0a16 6 0 0 0 32 0"/><text class="title" x="665.8" y="167.2" text-anchor="middle">System database</text><circle class="dot" cx="593.8" cy="192.3" r="2.5"/><text class="sub" x="603.8" y="196.8">Accessibility</text><circle class="dot" cx="593.8" cy="216.3" r="2.5"/><text class="sub" x="603.8" y="220.8">Screen recording</text><circle class="dot" cx="593.8" cy="240.3" r="2.5"/><text class="sub" x="603.8" y="244.8">Full Disk Access</text><rect class="box" x="563" y="272" width="205.5" height="162" rx="14"/><path class="ink" transform="translate(665.8 297.2)" d="M-16 -14a16 6 0 1 0 32 0a16 6 0 1 0 -32 0zM-16 -14v28a16 6 0 0 0 32 0v-28M-16 0a16 6 0 0 0 32 0"/><text class="title" x="665.8" y="347.2" text-anchor="middle">Your user's database</text><circle class="dot" cx="593.8" cy="372.3" r="2.5"/><text class="sub" x="603.8" y="376.8">Camera</text><circle class="dot" cx="593.8" cy="396.3" r="2.5"/><text class="sub" x="603.8" y="400.8">Microphone</text><circle class="dot" cx="593.8" cy="420.3" r="2.5"/><text class="sub" x="603.8" y="424.8">Contacts</text><path class="edge" d="M229.5 263L293.5 263"/><path class="edge" d="M499 263L531 263L531 173L563 173"/><path class="edge" d="M499 263L531 263L531 353L563 353"/><path class="edge" d="M768.5 173L800.5 173L800.5 263L832.5 263"/><path class="edge" d="M768.5 353L800.5 353L800.5 263L832.5 263"/></svg>
